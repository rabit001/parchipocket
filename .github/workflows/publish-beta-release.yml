name: Publish ParchiPocket Beta Release

on:
  workflow_dispatch:
    inputs:
      expected_signing_sha256:
        description: SHA-256 fingerprint of the expected release signing certificate
        required: true
        type: string
      release_notes:
        description: User-facing notes for this Beta release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: parchipocket-beta-release
  cancel-in-progress: false

jobs:
  publish-beta:
    name: Build and publish signed Beta APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: direct-apk-release
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify branch, commit, version and Beta baseline
        id: version
        shell: bash
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          import os
          import re
          from urllib.parse import urlparse
          import urllib.request
          from pathlib import Path

          pubspec = Path("mobile/parchipocket_flutter/pubspec.yaml").read_text(encoding="utf-8")
          match = re.search(r"^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$", pubspec, re.MULTILINE)
          if not match:
              raise SystemExit("pubspec.yaml must contain a numeric versionName+versionCode.")
          version_name, version_code_text = match.groups()
          version_code = int(version_code_text)
          if version_code < 1:
              raise SystemExit("Android versionCode must be positive.")
          tag = f"parchipocket-beta-v{version_name}-{version_code}"
          if not re.fullmatch(r"parchipocket-beta-v\d+\.\d+\.\d+-\d+", tag):
              raise SystemExit("The Beta tag does not match the required naming convention.")
          notes = os.environ.get("RELEASE_NOTES", "").strip()
          if not notes:
              raise SystemExit("Release notes are required.")

          releases = []
          for page in range(1, 101):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/rabit001/parchipocket/releases?per_page=100&page={page}",
                  headers={"Accept": "application/vnd.github+json", "User-Agent": "ParchiPocket-Beta-Workflow"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  page_releases = json.load(response)
              if not page_releases:
                  break
              releases.extend(page_releases)
              if len(page_releases) < 100:
                  break
          else:
              raise SystemExit("Could not safely enumerate all published releases.")
          beta = [item for item in releases if item.get("draft") is False and item.get("prerelease") is True
                  and re.fullmatch(r"parchipocket-beta-v\d+\.\d+\.\d+-\d+", item.get("tag_name", ""))]
          latest_code = 0
          for release in beta:
              manifest_asset = next((asset for asset in release.get("assets", [])
                                     if asset.get("name") == "app-update-manifest.json"), None)
              if manifest_asset is None:
                  raise SystemExit("A published Beta has no update manifest; refusing to guess its version.")
              manifest_url = urlparse(manifest_asset.get("browser_download_url", ""))
              expected_manifest_path = f"/rabit001/parchipocket/releases/download/{release['tag_name']}/app-update-manifest.json"
              if manifest_url.scheme != "https" or manifest_url.hostname != "github.com" or manifest_url.path != expected_manifest_path:
                  raise SystemExit("A Beta manifest asset URL is not a trusted GitHub release asset.")
              manifest_request = urllib.request.Request(
                  manifest_asset.get("browser_download_url", ""),
                  headers={"User-Agent": "ParchiPocket-Beta-Workflow"},
              )
              with urllib.request.urlopen(manifest_request, timeout=30) as response:
                  manifest = json.load(response)
              release_match = re.fullmatch(r"parchipocket-beta-v(\d+\.\d+\.\d+)-(\d+)", release["tag_name"])
              if (manifest.get("channel") != "beta"
                      or manifest.get("packageName") != "com.parchipocket.app.parchipocket"
                      or not isinstance(manifest.get("versionCode"), int)
                      or release_match is None
                      or manifest.get("versionName") != release_match.group(1)
                      or manifest.get("versionCode") != int(release_match.group(2))
                      or not re.fullmatch(r"[a-fA-F0-9]{64}", manifest.get("sha256", ""))):
                  raise SystemExit("A published Beta manifest is invalid; refusing to publish.")
              latest_code = max(latest_code, manifest["versionCode"])
          if version_code <= latest_code:
              raise SystemExit(f"versionCode {version_code} must be greater than the latest Beta versionCode {latest_code}.")

          Path(os.environ["RUNNER_TEMP"], "beta-release-notes.md").write_text(notes + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version_name={version_name}\nversion_code={version_code}\ntag={tag}\n")
          print(f"Validated Beta version {version_name} ({version_code}) for commit {os.environ['GITHUB_SHA']}.")
          PY
          tag="$(awk -F= '$1 == "tag" { print $2 }' "$GITHUB_OUTPUT")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "The Beta tag already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: "3.47.9"
          cache: true

      - name: Fetch Flutter dependencies
        working-directory: mobile/parchipocket_flutter
        run: flutter pub get --enforce-lockfile

      - name: Decode upload keystore to runner temp
        shell: bash
        env:
          PP_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PP_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = "".join(os.environ.get("PP_UPLOAD_KEYSTORE_BASE64", "").split())
          if not encoded:
              raise SystemExit("Required environment secret PP_UPLOAD_KEYSTORE_BASE64 is missing.")
          try:
              data = base64.b64decode(encoded, validate=True)
          except Exception:
              raise SystemExit("PP_UPLOAD_KEYSTORE_BASE64 is not valid base64.")
          if len(data) < 4 or data[:4] != bytes.fromhex("feedfeed"):
              raise SystemExit("Decoded upload keystore is not a JKS file.")
          keystore = Path(os.environ["RUNNER_TEMP"]) / "parchipocket-release.jks"
          descriptor = os.open(keystore, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, "wb") as output:
              output.write(data)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as github_env:
              github_env.write(f"PP_UPLOAD_KEYSTORE_PATH={keystore}\n")
          PY

      - name: Build signed release APK
        working-directory: mobile/parchipocket_flutter
        env:
          PP_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/parchipocket-release.jks
          PP_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PP_UPLOAD_KEYSTORE_PASSWORD }}
          PP_UPLOAD_KEY_ALIAS: ${{ secrets.PP_UPLOAD_KEY_ALIAS }}
          PP_UPLOAD_KEY_PASSWORD: ${{ secrets.PP_UPLOAD_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Verify package and signing certificate
        shell: bash
        working-directory: mobile/parchipocket_flutter
        env:
          EXPECTED_SIGNING_CERT_SHA256: ${{ inputs.expected_signing_sha256 }}
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root" || { echo "Android SDK root is unavailable." >&2; exit 1; }
          apksigner="$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner" || { echo "apksigner was not found." >&2; exit 1; }
          aapt="$(dirname "$apksigner")/aapt"
          expected_package="com.parchipocket.app.parchipocket"
          actual_package="$("$aapt" dump badging "$apk" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | sed -n '1p')"
          test "$actual_package" = "$expected_package" || { echo "Unexpected APK package ID." >&2; exit 1; }
          report="$RUNNER_TEMP/apksigner-verify.txt"
          "$apksigner" verify --verbose --print-certs "$apk" > "$report"
          sha1="$(awk -F ': ' '/certificate SHA-1 digest:/ {print $NF; exit}' "$report")"
          sha256="$(awk -F ': ' '/certificate SHA-256 digest:/ {print $NF; exit}' "$report")"
          expected="$(printf '%s' "$EXPECTED_SIGNING_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          actual="$(printf '%s' "$sha256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[a-f0-9]{64}$ ]] || { echo "Expected certificate SHA-256 must be 64 hexadecimal characters." >&2; exit 1; }
          test -n "$sha1" && test "$actual" = "$expected" || { echo "APK signing certificate did not match the expected certificate." >&2; exit 1; }
          cp "$apk" build/app/outputs/flutter-apk/parchipocket-release.apk
          printf '%s\n' "Package ID: $actual_package" "Certificate SHA-1: $sha1" "Certificate SHA-256: $sha256" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate checksum and update manifest
        id: assets
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/beta-release-notes.md
        run: |
          set -euo pipefail
          apk="mobile/parchipocket_flutter/build/app/outputs/flutter-apk/parchipocket-release.apk"
          checksum="$apk.sha256"
          sha256sum "$apk" > "$checksum"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          apk = Path("mobile/parchipocket_flutter/build/app/outputs/flutter-apk/parchipocket-release.apk")
          hasher = hashlib.sha256()
          with apk.open("rb") as source:
              for chunk in iter(lambda: source.read(1024 * 1024), b""):
                  hasher.update(chunk)
          digest = hasher.hexdigest()
          notes = Path(os.environ["RELEASE_NOTES_FILE"]).read_text(encoding="utf-8").strip()
          manifest = {
              "schemaVersion": 1,
              "channel": "beta",
              "packageName": "com.parchipocket.app.parchipocket",
              "versionName": os.environ["VERSION_NAME"],
              "versionCode": int(os.environ["VERSION_CODE"]),
              "apkAssetName": apk.name,
              "sha256": digest,
              "releaseNotes": notes,
              "publishedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          Path("app-update-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"sha256={digest}\n")
          PY

      - name: Create Beta tag and publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          EXPECTED_ASSETS: parchipocket-release.apk,parchipocket-release.apk.sha256,app-update-manifest.json
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "The Beta tag already exists; refusing to overwrite it." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$RELEASE_TAG" "$GITHUB_SHA" --message "ParchiPocket Beta $VERSION_NAME ($GITHUB_SHA)"
          git push origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          gh release create "$RELEASE_TAG" \
            mobile/parchipocket_flutter/build/app/outputs/flutter-apk/parchipocket-release.apk \
            mobile/parchipocket_flutter/build/app/outputs/flutter-apk/parchipocket-release.apk.sha256 \
            app-update-manifest.json \
            --repo rabit001/parchipocket \
            --title "ParchiPocket Beta $VERSION_NAME" \
            --notes-file "$RUNNER_TEMP/beta-release-notes.md" \
            --prerelease
          gh release view "$RELEASE_TAG" --repo rabit001/parchipocket --json tagName,isPrerelease,assets > "$RUNNER_TEMP/release-verification.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          release = json.loads(Path(os.environ["RUNNER_TEMP"], "release-verification.json").read_text())
          expected = set(os.environ["EXPECTED_ASSETS"].split(","))
          actual = {asset["name"] for asset in release.get("assets", [])}
          if release.get("tagName") != os.environ["RELEASE_TAG"] or release.get("isPrerelease") is not True or not expected.issubset(actual):
              raise SystemExit("The published Beta release did not pass asset and prerelease verification.")
          PY
          printf '%s\n' "Published prerelease tag: $RELEASE_TAG" "Built commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/parchipocket-release.jks"
          if [[ -f "$keystore" ]]; then
            shred -u "$keystore" 2>/dev/null || rm -f "$keystore"
          fi
          rm -f "$RUNNER_TEMP/apksigner-verify.txt"
