name: ParchiPocket backend validation

on:
  push:
    branches:
      - main
      - "backend/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_android_integration:
        description: "Run the Android emulator integration suite (slow; use when the emulator runner is available)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  FIRESTORE_EMULATOR_PROJECT_ID: demo-parchipocket-phase4

jobs:
  android-debug-apk:
    name: Build and upload Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch dependencies
        working-directory: mobile/parchipocket_flutter
        run: flutter pub get
      - name: Build debug APK
        working-directory: mobile/parchipocket_flutter
        run: flutter build apk --debug
      - name: Verify APK exists
        working-directory: mobile/parchipocket_flutter
        run: test -f build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: parchipocket-debug-apk
          path: mobile/parchipocket_flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  flutter:
    name: Flutter tests and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch dependencies
        working-directory: mobile/parchipocket_flutter
        run: flutter pub get
      - name: Unit and widget tests
        working-directory: mobile/parchipocket_flutter
        run: flutter test --reporter compact
      - name: Static analysis
        working-directory: mobile/parchipocket_flutter
        run: flutter analyze
      - name: Rules harness syntax
        run: node --check test_rules.js
      - name: Whitespace validation
        run: git diff --check origin/main...HEAD

  firestore-rules:
    name: Firestore and account-deletion security harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Cloud Functions test dependencies
        run: npm ci --prefix functions
      - name: Validate security test harness syntax
        run: |
          node --check test_rules.js
          node --check test_deletion.js
          node --check functions/src/account_deletion/index.js
      - name: Run Firestore rules and account-deletion harnesses in isolated demo emulators
        env:
          FIRESTORE_EMULATOR_PROJECT_ID: demo-parchipocket-phase4
        run: npx --yes firebase-tools@latest emulators:exec --only auth,firestore --project demo-parchipocket-phase4 "node test_rules.js && node test_deletion.js"

  firestore-integration:
    name: Dart Firestore/Auth integration on Android emulator
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_android_integration) || github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    needs:
      - flutter
      - firestore-rules
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Free disk space for Android emulator
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /
      - name: Enable KVM permissions for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Dart integration tests on Android emulator with local Firebase emulators
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            npx --yes firebase-tools@latest emulators:exec --only auth,firestore --project demo-parchipocket-phase4 "cd mobile/parchipocket_flutter && flutter pub get && flutter test integration_test/firestore_service_emulator_test.dart -d emulator-5554 --reporter compact && flutter test integration_test/daily_log_pagination_emulator_test.dart -d emulator-5554 --reporter compact"

  publish-debug-release:
    name: Publish debug APK to GitHub Release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - android-debug-apk
      - flutter
      - firestore-rules
      - firestore-integration
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified debug APK
        uses: actions/download-artifact@v4
        with:
          name: parchipocket-debug-apk
          path: release-assets
      - name: Generate SHA-256 checksum
        run: sha256sum release-assets/app-debug.apk > release-assets/app-debug.apk.sha256
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.1.1-debug
          name: ParchiPocket v0.1.1 Debug Preview
          body: |
            Debug build for testing only. This APK is not a production-signed release.
            Published automatically after the main-branch Flutter tests, Firestore rules checks, and Android emulator integration tests pass.
          prerelease: true
          draft: false
          overwrite_files: true
          files: |
            release-assets/app-debug.apk
            release-assets/app-debug.apk.sha256
