name: Release quality gates

on:
  workflow_call:

permissions:
  contents: read

jobs:
  flutter-validation:
    name: Flutter static analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          cache: true

      - name: Fetch dependencies
        working-directory: mobile/parchipocket_flutter
        run: flutter pub get --enforce-lockfile

      - name: Static analysis
        working-directory: mobile/parchipocket_flutter
        run: flutter analyze

      - name: Unit and widget tests
        working-directory: mobile/parchipocket_flutter
        run: flutter test --reporter compact

      - name: Verify build compilation
        working-directory: mobile/parchipocket_flutter
        run: flutter build apk --debug

  security-validation:
    name: Firestore rules and account-deletion security harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Cloud Functions test dependencies
        run: npm ci --prefix functions

      - name: Validate security harness and deletion portal JavaScript
        run: |
          node --check test_rules.js
          node --check test_deletion.js
          node --check functions/src/account_deletion/index.js
          node -e "const fs=require('fs'); const html=fs.readFileSync('public/delete-account/index.html','utf8'); const scripts=[...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/g)].map(match=>match[1]).filter(code=>code.trim()); if (scripts.length !== 1) throw new Error('Expected exactly one inline deletion-portal script'); fs.writeFileSync('/tmp/parchipocket-delete-account.js', scripts[0]);"
          node --check /tmp/parchipocket-delete-account.js

      - name: Run Firestore rules and account-deletion harnesses in isolated demo emulators
        env:
          FIRESTORE_EMULATOR_PROJECT_ID: demo-parchipocket-phase4
        run: npx --yes firebase-tools@latest emulators:exec --only auth,firestore --project demo-parchipocket-phase4 "node test_rules.js && node test_deletion.js"
