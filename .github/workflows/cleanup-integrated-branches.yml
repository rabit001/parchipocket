name: Clean up integrated branches

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulate cleanup without deleting any branch (default: true)"
        type: boolean
        required: true
        default: true
      target_branch:
        description: "Protected target branch that candidate branches must be merged into"
        type: string
        required: false
        default: "main"
      branch_filter:
        description: "Optional branch name filter regex (leave empty to evaluate all branches)"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: branch-cleanup
  cancel-in-progress: false

jobs:
  evaluate-branches:
    name: Evaluate candidate branches (dry-run & safety audit)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible_branches: ${{ steps.evaluate.outputs.eligible_branches }}
      eligible_count: ${{ steps.evaluate.outputs.eligible_count }}
      dry_run: ${{ steps.evaluate.outputs.dry_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Evaluate branches for safe cleanup
        id: evaluate
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          BRANCH_FILTER: ${{ inputs.branch_filter }}
        with:
          script: |
            const engine = require('./.github/scripts/cleanup_branches.js');
            const dryRun = process.env.DRY_RUN !== 'false';
            const targetBranch = process.env.TARGET_BRANCH || 'main';
            const branchFilter = process.env.BRANCH_FILTER || '';

            await engine.evaluateAndPlan({
              github,
              context,
              core,
              options: { dryRun, targetBranch, branchFilter }
            });

  delete-branches:
    name: Execute verified branch cleanup
    needs: evaluate-branches
    if: github.ref == 'refs/heads/main' && inputs.dry_run == false && needs.evaluate-branches.outputs.eligible_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Execute verified branch deletion
        uses: actions/github-script@v7
        env:
          ELIGIBLE_BRANCHES_JSON: ${{ needs.evaluate-branches.outputs.eligible_branches }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        with:
          script: |
            const engine = require('./.github/scripts/cleanup_branches.js');
            const eligibleBranches = JSON.parse(process.env.ELIGIBLE_BRANCHES_JSON || '[]');
            const targetBranch = process.env.TARGET_BRANCH || 'main';

            await engine.executeDeletion({
              github,
              context,
              core,
              eligibleBranches,
              options: { targetBranch }
            });
