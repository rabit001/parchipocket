name: parchipocket
description: ParchiPocket household expense and digital billing app.
publish_to: 'none'
version: 0.1.5+5
environment:
  sdk: '>=3.7.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_app_check: ^0.3.1+6
  firebase_crashlytics: ^4.3.0
  firebase_performance: ^0.10.1
  crypto: 3.0.8
  qr_flutter: 4.1.0
  mobile_scanner: 7.4.2
  speech_to_text:
    path: ../../packages/speech_to_text
  shared_preferences: ^2.5.6
  google_sign_in: 7.2.0
  image_picker: 1.1.2
  path_provider: 2.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  assets:
    - assets/branding/
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/parchipocket_app_icon_1024.png
  adaptive_icon_background: '#014299'
  adaptive_icon_foreground: assets/branding/parchipocket_app_icon_1024.png
  adaptive_icon_foreground_inset: 16
